<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Алғашқы өлеңдер</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #dcefff, #ffffff);
    color:#1a2b5a;
}

.container{
    width:80%;
    margin:auto;
    padding:20px;
}

header{
    text-align:center;
    padding:40px;
}

h1{
    font-size:50px;
    color:#123c7a;
}

.greeting{
    background:#eef5ff;
    padding:15px;
    border-radius:20px;
    width:60%;
    margin:auto;
    font-size:24px;
}

.section{
    background:white;
    margin:30px 0;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
    color:#0d6b4d;
    font-size:40px;
}

h3{
    color:#4b45c5;
    font-size:36px;
}

img{
    width:300px;
    border-radius:20px;
    float:right;
    margin-left:20px;
}

.clear{
    clear:both;
}
</style>

</head>
<body>

<div class="container">

    <header>
        <h1>Алғашқы өлеңдер</h1>

        <div class="greeting">
            Сәлем! Бұл менің алғашқы парақшам!
        </div>
    </header>

    <div class="section">
        <img src="1.jpg" alt="Орман">

        <h2>🌲 Орманда</h2>

        <p>
            Орманда шырша дүниеге келді.<br>
            Ол орманда өсті.
        </p>

        <div class="clear"></div>
    </div>

    <div class="section">
        <img src="2.jpg" alt="Қыс және жаз">

        <h2>🍃 Қыс пен жаз</h2>

        <p align="right">
            Қыста да, жазда да сымбатты, жасыл болды.
        </p>

        <div class="clear"></div>
    </div>

    <div class="section">
        <img src="3.jpg" alt="Боран">

        <h3>❄ Боран мен аяз</h3>

        <p align="justify">
            Боран оған ән айтты:
            «Ұйықта, шыршам, әлди-әлди».<br><br>

            Аяз оны қармен қымтап:
            «Тоңып қалма!» деді.
        </p>

        <div class="clear"></div>
    </div>

</div>

</body>
</html>
